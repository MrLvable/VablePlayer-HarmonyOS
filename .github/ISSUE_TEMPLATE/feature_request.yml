name: 功能建议 / Feature request
description: 说明希望解决的实际使用问题
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的使用问题
      description: 描述场景和当前操作成本，无需提供个人媒体库或服务地址
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 希望得到的行为
      description: 如涉及来源协议，请提供公开官方文档或不含凭据的接口说明
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可接受的方案与补充说明（可选）
  - type: checkboxes
    id: contribution
    attributes:
      label: 可以协助的部分（可选）
      options:
        - label: 我可以提供原创最小样本或隔离环境复现步骤。
        - label: 我愿意参与文档、测试或代码贡献。
